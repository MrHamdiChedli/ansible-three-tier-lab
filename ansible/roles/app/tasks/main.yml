---
- name: Install Python virtual environments
  ansible.builtin.apt:
    name: python3-venv

- name: Create the app's system user
  ansible.builtin.user:
    name: app
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the app directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy the application
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/{{ item }}"
    dest: "/opt/app/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - app.py
    - requirements.txt
  notify: Restart app

- name: Install the Python dependencies
  ansible.builtin.pip:
    requirements: /opt/app/requirements.txt
    virtualenv: /opt/app/venv
    virtualenv_command: python3 -m venv
  notify: Restart app

- name: Write the app's settings, readable only by the app
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/app.env
    owner: root
    group: app
    mode: "0640"
  no_log: true
  notify: Restart app

- name: Install the systemd service
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/app.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart app

- name: Start the app now and at every boot
  ansible.builtin.systemd_service:
    name: app
    enabled: true
    state: started
    daemon_reload: true

- name: Open the app port to the load balancer only
  community.general.ufw:
    rule: allow
    port: "{{ app_port | string }}"
    proto: tcp
    from_ip: "{{ lb_ip }}"
