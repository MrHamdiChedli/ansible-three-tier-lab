---
# Addresses come from the inventory, so adding a web server there is enough
# for the database and the load balancer to accept it.
db_host: "{{ hostvars[groups['dbservers'][0]].ansible_host }}"
lb_ip: "{{ hostvars[groups['loadbalancers'][0]].ansible_host }}"
web_ips: "{{ groups['webservers'] | map('extract', hostvars, 'ansible_host') | list }}"

db_name: appdb
db_user: app
db_password: "{{ lookup('ansible.builtin.env', 'DB_PASSWORD') }}"
app_port: 8000
