---
- name: Prepare every server
  hosts: all
  become: true
  pre_tasks:
    - name: Check the database password was provided
      ansible.builtin.assert:
        that: db_password | length > 0
        fail_msg: Set DB_PASSWORD in the environment before running the playbook.
        quiet: true
      run_once: true
  roles:
    - common

- name: Configure the database
  hosts: dbservers
  become: true
  roles:
    - postgresql

- name: Configure the web servers
  hosts: webservers
  become: true
  roles:
    - app

- name: Configure the load balancer
  hosts: loadbalancers
  become: true
  roles:
    - nginx
